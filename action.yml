name: "Notes Summary README"
description: "🗒️ Generate a README.md summary for your notes repository"
author: "Anand Chowdhary <https://github.com/AnandChowdhary>"
runs:
  using: "node16"
  main: "dist/index.js"
inputs:
  token:
    required: true
    description: "GitHub token"
  commitMessage:
    required: false
    description: "Commit message"
  directory:
    required: true
    description: "Directory name"
  caption:
    required: false
    description: "JavaScript function to generate caption"
  githubToken:
    required: false
    description: "GitHub token for accessing GitHub Models API (defaults to GITHUB_TOKEN from Actions environment)"
  aiModel:
    required: false
    description: "AI model to use for emoji generation via GitHub Models"
    default: "gpt-5.1-nano"
branding:
  icon: "calendar"
  color: "green"
